name: ros_suz_testler
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test: [test_dstar_vs_astar, test_vision, test_moving, test_ros_split, test_3d, test_yolo, test_smooth, test_nofly]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pygame numpy opencv-python-headless
      - if: matrix.test == 'test_dstar_vs_astar'
        run: python sahte_veri.py
      - env:
          SDL_VIDEODRIVER: dummy
        run: python tests/${{ matrix.test }}.py